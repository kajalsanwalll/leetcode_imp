<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#06060a;
  --surface:#0e0e15;
  --surface2:#151520;
  --surface3:#1b1b2a;

  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);

  --text:#f2f2f7;
  --muted:#8f8fa7;

  --accent:#ff9900;
  --accent2:#ffb84d;
  --green:#22d46e;
  --red:#ff5d73;
  --blue:#60a5fa;
  --pink:#f472b6;
  --purple:#a78bfa;

  --display:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;

  --radius:16px;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  overflow-x:hidden;
}

/* background glow */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top right, rgba(255,153,0,0.08), transparent 25%),
  radial-gradient(circle at bottom left, rgba(96,165,250,0.06), transparent 25%);
  pointer-events:none;
}

/* main wrapper */
.wrapper{
  max-width:1450px;
  margin:auto;
  padding:32px;
}

/* hero */

.hero{
  background:linear-gradient(145deg,#0f0f18,#12121f);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
  position:relative;
  overflow:hidden;
  margin-bottom:28px;
}

.hero::before{
  content:'';
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(255,153,0,0.09), transparent 70%);
  top:-260px;
  right:-180px;
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.logo-wrap{
  display:flex;
  gap:16px;
  align-items:center;
}

.logo{
  width:60px;
  height:60px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff6600,#ff9900,#ffcf70);
  display:flex;
  align-items:center;
  justify-content:center;
  color:black;
  font-family:var(--display);
  font-weight:700;
  font-size:24px;
  box-shadow:0 0 40px rgba(255,153,0,0.25);
}

.hero h1{
  font-family:var(--display);
  font-size:38px;
  line-height:1.1;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}

.badges{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.badge{
  padding:7px 14px;
  border-radius:999px;
  font-size:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  letter-spacing:1px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:28px;
}

.stat{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.stat-number{
  font-size:36px;
  font-family:var(--display);
  font-weight:700;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.progress{
  margin-top:28px;
}

.progress-bar{
  height:8px;
  background:var(--surface3);
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ff6600,#ff9900,#ffd280);
  transition:0.4s;
}

.progress-text{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
}

/* sections */

.section-title{
  font-family:var(--display);
  font-size:18px;
  margin:36px 0 16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.section-title::after{
  content:'';
  height:1px;
  flex:1;
  background:var(--border);
}

.week{
  margin-bottom:18px;
}

.week-header{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:0.2s;
}

.week-header:hover{
  border-color:var(--border2);
  background:var(--surface2);
}

.week-left{
  display:flex;
  align-items:center;
  gap:18px;
}

.week-label{
  background:rgba(255,153,0,0.12);
  border:1px solid rgba(255,153,0,0.25);
  color:var(--accent);
  padding:6px 12px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
}

.week-title-text{
  font-family:var(--display);
  font-size:20px;
  font-weight:600;
}

.week-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.week-progress{
  font-size:12px;
  color:var(--muted);
}

.mini-bar{
  width:110px;
  height:5px;
  background:var(--surface3);
  border-radius:999px;
  overflow:hidden;
}

.mini-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.chevron{
  color:var(--muted);
  transition:0.3s;
}

.week.collapsed .chevron{
  transform:rotate(-90deg);
}

.week.collapsed .week-content{
  display:none;
}

.week-content{
  margin-top:12px;
}

.focus-box{
  background:rgba(255,153,0,0.05);
  border:1px solid rgba(255,153,0,0.14);
  border-radius:18px;
  padding:16px 18px;
  margin-bottom:14px;
  color:var(--muted);
  font-size:13px;
}

.tip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
  margin-bottom:14px;
}

.tip{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}

.tip-title{
  font-family:var(--display);
  font-size:14px;
  color:var(--accent2);
  margin-bottom:10px;
}

.tip ul{
  padding-left:16px;
}

.tip li{
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
  line-height:1.5;
}

.category{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:14px;
}

.category-head{
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.category-name{
  font-size:12px;
  color:var(--accent);
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}

.task{
  display:flex;
  gap:16px;
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:0.15s;
}

.task:last-child{
  border-bottom:none;
}

.task:hover{
  background:rgba(255,255,255,0.03);
}

.task.done{
  background:rgba(34,212,110,0.08);
}

.checkbox{
  width:20px;
  height:20px;
  border-radius:6px;
  border:1.5px solid var(--border2);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:2px;
}

.task.done .checkbox{
  background:var(--green);
  border-color:var(--green);
}

.check{
  width:5px;
  height:10px;
  border:2px solid black;
  border-top:none;
  border-left:none;
  transform:rotate(45deg);
  display:none;
}

.task.done .check{
  display:block;
}

.task-main{
  flex:1;
}

.task-title{
  font-size:13px;
  line-height:1.6;
}

.task.done .task-title{
  text-decoration:line-through;
  color:var(--muted);
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.tag{
  font-size:9px;
  padding:4px 8px;
  border-radius:999px;
  font-weight:700;
  letter-spacing:1px;
}

.easy{
  background:rgba(34,212,110,0.1);
  color:#22d46e;
}

.med{
  background:rgba(251,191,36,0.1);
  color:#fbbf24;
}

.hard{
  background:rgba(255,77,77,0.12);
  color:#ff5d73;
}

.lp{
  background:rgba(244,114,182,0.1);
  color:#f472b6;
}

.cs{
  background:rgba(96,165,250,0.1);
  color:#60a5fa;
}

.mock{
  background:rgba(167,139,250,0.12);
  color:#a78bfa;
}

.note{
  margin-top:10px;
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
  background:rgba(255,255,255,0.03);
  border-left:2px solid rgba(255,153,0,0.4);
  padding:10px 12px;
  border-radius:0 10px 10px 0;
}

@media(max-width:850px){

  .wrapper{
    padding:18px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:28px;
  }

  .week-header{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }
}
</style>
</head>

let done = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
}

function toggleTask(id){

  if(done.includes(id)){
    done = done.filter(x => x !== id);
  }else{
    done.push(id);
  }

  save();
  render();
}

function toggleWeek(id){
  document.getElementById(id).classList.toggle("collapsed");
}

function renderStats(total){

  const completed = done.length;
  const left = total - completed;
  const pct = Math.round((completed / total) * 100);

  document.getElementById("doneCount").innerText = completed;
  document.getElementById("leftCount").innerText = left;
  document.getElementById("percentCount").innerText = pct + "%";
  document.getElementById("totalCount").innerText = total;

  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").innerText =
    completed + " / " + total + " complete";
}

function render(){

  const app = document.getElementById("app");

  let html = "";
  let totalTasks = 0;

  DATA.forEach((week, wi) => {

    let weekTotal = 0;
    let weekDone = 0;

    week.sections.forEach((sec, si) => {
      sec.tasks.forEach((task, ti) => {

        weekTotal++;
        totalTasks++;

        const id = `${wi}-${si}-${ti}`;

        if(done.includes(id)) weekDone++;
      });
    });

    const pct = Math.round((weekDone / weekTotal) * 100);

    html += `
    <div class="week" id="week-${wi}">

      <div class="week-header" onclick="toggleWeek('week-${wi}')">

        <div class="week-left">

          <div class="week-label">${week.label}</div>

          <div class="week-title-text">
            ${week.title}
          </div>

        </div>

        <div class="week-right">

          <div class="week-progress">
            ${weekDone}/${weekTotal}
          </div>

          <div class="mini-bar">
            <div class="mini-fill" style="width:${pct}%"></div>
          </div>

          <div class="chevron">▾</div>

        </div>

      </div>

      <div class="week-content">

        <div class="focus-box">
          ${week.focus}
        </div>

        <div class="tip-grid">

          ${week.tips.map(t => `
            <div class="tip">

              <div class="tip-title">
                ${t.title}
              </div>

              <ul>
                ${t.points.map(p => `<li>${p}</li>`).join("")}
              </ul>

            </div>
          `).join("")}

        </div>

        ${week.sections.map((sec, si) => {

          const doneCount =
          sec.tasks.filter((_, ti) =>
          done.includes(`${wi}-${si}-${ti}`)).length;

          return `

          <div class="category">

            <div class="category-head">

              <div class="category-name">
                ${sec.name}
              </div>

              <div style="font-size:11px;color:var(--muted)">
                ${doneCount}/${sec.tasks.length}
              </div>

            </div>

            ${sec.tasks.map((task, ti) => {

              const id = `${wi}-${si}-${ti}`;
              const isDone = done.includes(id);

              return `
              <div class="task ${isDone ? 'done' : ''}"
                   onclick="toggleTask('${id}')">

                <div class="checkbox">
                  <div class="check"></div>
                </div>

                <div class="task-main">

                  <div class="task-title">
                    ${task.title}
                  </div>

                  <div class="tags">
                    ${task.tags.map(tag =>
                      `<span class="tag ${tag}">
                        ${tag.toUpperCase()}
                      </span>`).join("")}
                  </div>

                </div>

              </div>
              `;
            }).join("")}

          </div>

          `;
        }).join("")}

      </div>

    </div>
    `;
  });

  app.innerHTML = html;

  renderStats(totalTasks);
}

render();

</script>

</body>
</html>
